name: Build Ravengard release jars

on:
  push:
    branches: [ "master" ]

permissions:
  contents: write

concurrency:
  group: ravengard-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build the Ravengard jars
        run: ./gradlew --parallel --build-cache :loader:shadowJar :velocity.extension:shadowJar :packer:shadowJar :service.orchestrator:shadowJar :service.party:shadowJar

      - name: Add jars to GitHub releases
        uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "latest"
          prerelease: false
          title: "Automatic Build"
          files: |
            loader/build/libs/HypixelCore.jar
            velocity.extension/build/libs/SkyBlockProxy.jar
            packer/build/libs/net.swofty.packer.HypixelPackServer.jar
            service.orchestrator/build/libs/ServiceOrchestrator.jar
            service.party/build/libs/ServiceParty.jar
