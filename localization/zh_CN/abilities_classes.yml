  # ---- 技能描述（数值高亮与英文一致：HP 红、百分比绿、时间黄）----
  "Increases physical defense by 30% for 10 seconds.": "在 <e>10 秒</e>内提升 <a>30%</a> 物理防御。"
  "Taunts enemies within a 7-block radius to target you.": "嘲讽 <a>7 格</a>范围内的敌人，使其以你为目标。"
  "Pushes back all enemies within a 5-block radius.": "击退 <a>5 格</a>范围内的所有敌人。"
  "Temporarily boosts the damage dealt by all team members within a 6-block radius by 20%.": "暂时提升 <a>6 格</a>范围内\n所有队友 <a>20%</a> 的伤害。"
  "Applies a bleed that deals 10 HP of damage every second for 5 seconds.": "造成流血效果，<e>5 秒</e>内\n每秒造成 <c>10 HP</c> 伤害。"
  "Instantly heals +30 HP.": "立即恢复 <c>+30 HP</c>。"
  "Attacks deal 20% more damage for 5 seconds.": "<e>5 秒</e>内攻击伤害提高 <a>20%</a>。"
  "Increases damage by 20% on your next attack.": "下一次攻击的伤害提高 <a>20%</a>。"
  "Reduces the defense of the enemy by 10% for 5 seconds.": "<e>5 秒</e>内降低敌人 <a>10%</a> 防御。"
  "Incoming damage is reduced by 20% for 10 seconds.": "<e>10 秒</e>内受到的伤害降低 <a>20%</a>。"
  "Heals +35 HP over 10 seconds.": "在 <e>10 秒</e>内恢复 <c>+35 HP</c>。"
  "No stamina loss for 5 seconds.": "<e>5 秒</e>内不消耗体力。"
  "Knocks back all mobs within a radius of 5 blocks.": "击退 <a>5 格</a>范围内的所有怪物。"
  "Increases knockback for 5 seconds.": "<e>5 秒</e>内提高击退力度。"
  "Increases arrow damage by 20% for 10 seconds.": "<e>10 秒</e>内箭矢伤害提高 <a>20%</a>。"
  "Loose your next 3 arrows instantly.": "接下来的 3 支箭瞬间射出。"
  "Your next arrow will poison its target for 6 seconds.": "下一支箭会使目标中毒 <e>6 秒</e>。"
  "Your next arrow will slow its target for 2 seconds.": "下一支箭会使目标减速 <e>2 秒</e>。"
  "Heals +30 HP.": "恢复 <c>+30 HP</c>。"
  "Loose two arrows simultaneously.": "同时射出两支箭。"
  "Loose your next arrow instantly.": "下一支箭瞬间射出。"
  "Attacks deal 30% more damage for 10 seconds.": "<e>10 秒</e>内攻击伤害提高 <a>30%</a>。"
  "Dashes forward 6 blocks.": "向前冲刺 <a>6 格</a>。"
  "Your next attack will deal 80% more damage.": "下一次攻击造成额外 <a>80%</a> 伤害。"
  "Become invisible for 25 seconds, but movement speed is reduced.": "隐身 <e>25 秒</e>，但移动速度降低。"
  "Attacking or being attacked cancels the invisibility.": "攻击或受到攻击会解除隐身。"
  "Increases movement speed by 50% with no stamina loss.": "移动速度提高 <a>50%</a> 且不消耗体力。"
  "Applies 7 damage every 6 seconds to the target.": "每 <e>6 秒</e>对目标造成 <a>7</a> 点伤害。"
  "Fires an electric strike towards players. On impact causes 40 damage to target and damages others close by.": "向玩家射出一道电击，命中时\n对目标造成 <a>40</a> 点伤害并波及周围。"
  "Spawn a small moving fireball that deals 60 damage on impact.": "发射一枚小型火球，\n命中时造成 <a>60</a> 点伤害。"
  "Fires a continuous stream of ice that deals 10 damage and knockbacks on each hit.": "持续射出冰流，每次命中\n造成 <a>10</a> 点伤害并击退。"
  "Rips up the earth around its user, dealing 20 damage to any enemy within its radius.": "撕裂周围的大地，对范围内\n所有敌人造成 <a>20</a> 点伤害。"
  "Heals +45 HP over 10 seconds.": "在 <e>10 秒</e>内恢复 <c>+45 HP</c>。"
  "Spawns 3 powerful air slashes through the air, dealing 50 damage and pushing enemies back.": "释放 3 道强力风刃，\n造成 <a>50</a> 点伤害并击退敌人。"
  "Temporarily reduces the cooldown on Magical Items by 50%!": "暂时将<d>魔法物品</d>的冷却缩短 <a>50%</a>！"

