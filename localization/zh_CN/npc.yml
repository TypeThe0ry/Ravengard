# NPC：名字、头衔、对白、公告板
entries:
  # ---- 名字与头衔 ----
  "Ashwyn": "阿什温"
  "Rook": "鲁克"
  "Wayland": "韦兰"
  "Darwin": "达尔文"
  "Mr. Freegier": "弗里吉尔先生"
  "Baldwin": "鲍德温"
  "Diago": "迪亚戈"
  "Gabriel": "加布里埃尔"
  "Hector": "赫克托"
  "Villager": "村民"
  "Ravenport Guard": "渡鸦港卫兵"
  "Castle Guard": "城堡卫兵"
  "Guard": "卫兵"
  "Ship Captain": "船长"
  "Ship Captain Tutorial": "船长"
  "Harbor Master": "港务长"
  "Tavern Master": "酒馆老板"
  "Collector": "收藏家"
  "Alchemist": "炼金术士"
  "Armorer": "军械师"
  "Blacksmith": "铁匠"
  "Free Gear": "免费装备"
  "Queue": "排队"

  # ---- 阿什温（炼金术士）----
  "Hello there, adventurer! Always good to see a new face.": "你好，冒险者！见到新面孔总是件好事。"
  "My name's Ashwyn. I'm an alchemist here in Ravengard.": "我叫阿什温，是天穹余烬的炼金术士。"
  "I offer medical treatments and remedies for a fair price.": "我以公道的价格提供医疗和药剂。"
  "Things haven't been easy these last few months with so many wounded soldiers, but we do our best to help those in need.": "这几个月伤兵太多，日子不好过，但我们会尽力帮助需要帮助的人。"
  "You don't seem to be injured. Let's hope it stays that way!": "你看起来没受伤。希望能一直如此！"
  "If you need any medical supplies, or perhaps healing remedies, don't hesitate to come see me.": "如果需要医疗用品或治疗药剂，随时来找我。"
  "Stay safe out there, adventurer!": "在外面注意安全，冒险者！"

  # ---- 鲁克（军械师）----
  "Well hello there! Haven't seen you around here before.": "哟，你好！以前没在这儿见过你。"
  "The name's Rook. I'm the town's armorer.": "我叫鲁克，是镇上的军械师。"
  "I make and sell the best armor and garbs money can buy.": "我打造并出售用钱能买到的最好的盔甲和衣物。"
  "Are you looking for anything in particular? Or perhaps looking to sell?": "想找什么特别的东西吗？还是想卖点什么？"
  "See anything that you like?": "看到中意的了吗？"

  # ---- 韦兰（铁匠）----
  "Hello there! I'm Ravengard's finest blacksmith! Call me Wayland.": "你好！我是天穹余烬最好的铁匠！叫我韦兰就行。"
  "Now, what is it you'll be needing?": "那么，你需要点什么？"
  "Swords? Axes? Maces?": "剑？斧？钉锤？"
  "I even dabble in a few magical weapons from time to time.": "我偶尔还会捣鼓几件魔法武器。"
  "Take a look around and let me know if you see something.": "随便看看，看中什么告诉我。"

  # ---- 达尔文（收藏家）----
  "Coming soon": "敬请期待"

  # ---- 弗里吉尔先生（免费装备）----
  "Need some basic gear? I'm helping!": "需要基础装备吗？我来帮忙！"
  "It's not great... But it's better than nothing.": "不算好……但总比没有强。"
  "I'm doing my part!": "我在尽我的一份力！"

  # ---- 鲍德温（港务长）----
  "Welcome to §5Ravenport§f! It's always nice to see a new adventurer.": "欢迎来到 <5>渡鸦港<f>！很高兴见到新的冒险者。"
  "Go ahead and visit the §9Raven's Nest§f. It's located §bnorth §fof here. You can't miss it!": "去 <9>渡鸦巢<f> 看看吧。就在这里的<b>北边<f>，不会错过的！"
  "Best of luck!": "祝你好运！"

  # ---- 渡鸦港卫兵 ----
  "I'm the second line of defense here against the rabble.": "我是这里抵御暴徒的第二道防线。"
  "We've got a lot of work to do.": "我们有很多活要干。"
  "Most of the time.": "大多数时候是这样。"

  # ---- 迪亚戈（船长）----
  "We've arrived at the coastal city of §eRavenport§f!": "我们到达海滨城市 <e>渡鸦港<f> 了！"
  "You should go chat to the §6Harbor Master§f. He's located near the docks.": "你应该去找 <6>港务长<f> 聊聊。他就在码头附近。"
  "Best of luck, adventurer!": "祝你好运，冒险者！"
  "We've almost arrived, adventurer!": "我们快到了，冒险者！"
  "Ravengard is in dire need of brave fighters.": "天穹余烬急需勇敢的战士。"
  "Tell me... What kind of fighter are you?": "告诉我……你是哪种战士？"

  # ---- 加布里埃尔（酒馆老板）----
  "Hello and welcome to the Raven's Nest! I'm Gabriel, owner of this fine establishment.": "你好，欢迎来到渡鸦巢！我是加布里埃尔，这家店的老板。"
  "This tavern serves as a gathering point for adventurers such as yourself.": "这家酒馆是像你这样的冒险者的聚集地。"
  "The guard outside will assist you when you're ready to enter the dungeon.": "准备好进入地牢时，外面的卫兵会协助你。"
  "If you're looking for some helpful tips, see Hector in the training area to the south of the town center.": "想要一些实用建议的话，去镇中心南边的训练区找赫克托。"
  "I wish you the best of luck on your adventures.": "祝你冒险顺利。"

  # ---- 村民 ----
  "Hello!": "你好！"

  # ---- 永夜号公告板（整块文字）----
  "Welcome to Ravengard!\nStill under development. Issues may arise.\n\n> PvPvE extraction where survival means everything!\n> Enter the dungeon and escape with loot.\n> Avoid the death wall as it surrounds a random location.\n> If you die you will lose everything you are carrying.\n> Store items in your Lock Box.\n> Defeat enemies to Level Up and unlock abilities!\n\nPlay test end date: August 31st\nHave fun and good luck!\n\nCLICK HERE to read more!\n": "<6>欢迎来到 <l>天穹余烬</l>！\n<8><o>仍在开发中，可能会出现问题。</o>\n\n<6><l>> </l><a>PvPvE <7>撤离玩法，<2>生存<7>就是一切！\n<6><l>> </l><7>进入<c>地牢<7>，带着<6>战利品<3>撤离<7>。\n<6><l>> </l><7>躲开<5>死亡之墙<7>，它会向随机地点收缩。\n<6><l>> </l><7>如果你<c>死亡<7>，将失去身上携带的<4>一切<7>。\n<6><l>> </l><7>把物品存进你的<d>保险箱<7>。\n<6><l>> </l><c>击败<7>敌人以<6>升级<7>并解锁技能！\n\n<7>测试结束日期：<6>8 月 31 日\n<7>玩得开心，祝你好运！\n\n<e><l><n>点击这里</n></l> 了解更多！\n"
