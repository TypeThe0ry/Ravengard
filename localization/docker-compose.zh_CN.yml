# Ravengard's Chinese resource pack layer (tooltip tags, button and title textures, glyph advances,
# pack name and icon), merged over the official pack. The text itself is written in Chinese in the
# source and configuration.
# Usage (from the repository root):
#   docker compose -f docker-compose.yml -f localization/docker-compose.zh_CN.yml up -d --force-recreate --no-deps pack_server ravengard_lobby ravengard_dungeon
services:
  ravengard_lobby:
    environment:
      RAVENGARD_LOCALE_DIR: /app/localization
    volumes:
      - ./localization/zh_CN:/app/localization:ro
  ravengard_dungeon:
    environment:
      RAVENGARD_LOCALE_DIR: /app/localization
    volumes:
      - ./localization/zh_CN:/app/localization:ro
  pack_server:
    volumes:
      - ./localization/zh_CN/resourcepack:/app/configuration/resourcepacks/ravengard-zh_CN:ro
