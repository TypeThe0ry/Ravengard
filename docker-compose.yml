x-forwarding-env: &forwarding_env
  FORWARDING_SECRET: ${FORWARDING_SECRET:-change-me}

services:
  mongodb:
    image: mongo:8.0.9
    container_name: hypixel_mongo
    restart: "unless-stopped"
    environment:
      MONGO_INITDB_DATABASE: Minestom # Default database name
      MONGO_URL: hypixel_mongo
    volumes:
      - mongodb-data:/data/db
    ports:
      - "27017:27017"
    networks:
      - hypixel_network
    healthcheck:
      test: |
        mongosh --eval "db.adminCommand('ping').ok" --quiet > /dev/null 2>&1 || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
    command: ["mongod", "--quiet"]

  redis:
    image: redis:latest
    container_name: hypixel_redis
    restart: "unless-stopped"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - hypixel_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  proxy:
    build:
      context: .
      dockerfile: "./DockerFiles/Dockerfile.proxy"
    container_name: hypixel_proxy
    restart: "unless-stopped"
    environment:
      <<: *forwarding_env
    ports:
      - "25565:25565"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./configuration:/app/configuration_files
    networks:
      - hypixel_network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "25565"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  game_server_builder:
    build:
      context: .
      dockerfile: "./DockerFiles/Dockerfile.game_server"
    image: game_server_prepared
    container_name: game_server_builder
    volumes:
      - ./configuration:/app/configuration_files
    networks:
      - hypixel_network

  ravengard_lobby:
    image: game_server_prepared
    container_name: ravengard_lobby
    restart: "unless-stopped"
    stop_grace_period: 60s
    environment:
      <<: *forwarding_env
      SERVICE_CMD: java -jar HypixelCore.jar RAVENGARD_LOBBY
    depends_on:
      proxy:
        condition: service_healthy
      game_server_builder:
        condition: service_started
    volumes:
      - ./configuration:/app/configuration_files
    networks:
      - hypixel_network

  ravengard_dungeon:
    image: game_server_prepared
    container_name: ravengard_dungeon
    restart: "unless-stopped"
    stop_grace_period: 60s
    environment:
      <<: *forwarding_env
      SERVICE_CMD: java -jar HypixelCore.jar RAVENGARD_DUNGEON
    depends_on:
      proxy:
        condition: service_healthy
      game_server_builder:
        condition: service_started
    volumes:
      - ./configuration:/app/configuration_files
    networks:
      - hypixel_network

  pack_server:
    image: game_server_prepared
    container_name: hypixel_pack_server
    restart: "unless-stopped"
    environment:
      <<: *forwarding_env
      SERVICE_CMD: java -jar net.swofty.packer.HypixelPackServer.jar
    ports:
      - "7270:7270"
    depends_on:
      game_server_builder:
        condition: service_started
    volumes:
      - ./configuration:/app/configuration_files
    networks:
      - hypixel_network

  service_orchestrator:
    image: game_server_prepared
    container_name: service_orchestrator
    restart: "unless-stopped"
    environment:
      <<: *forwarding_env
      SERVICE_CMD: java -jar ServiceOrchestrator.jar
    depends_on:
      redis:
        condition: service_healthy
      proxy:
        condition: service_healthy
      game_server_builder:
        condition: service_started
    volumes:
      - ./configuration:/app/configuration_files
    networks:
      - hypixel_network

  service_party:
    image: game_server_prepared
    container_name: service_party
    restart: "unless-stopped"
    environment:
      <<: *forwarding_env
      SERVICE_CMD: java -jar ServiceParty.jar
    depends_on:
      proxy:
        condition: service_healthy
      game_server_builder:
        condition: service_started
    volumes:
      - ./configuration:/app/configuration_files
    networks:
      - hypixel_network

volumes:
  mongodb-data:
    driver: local
    name: mongo-data
  redis-data:
    driver: local
    name: redis-data

networks:
  hypixel_network:
    driver: bridge
